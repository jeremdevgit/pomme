<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomme</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="ambient"></div>

<aside id="side">
  <div class="brand"><img src="icon.png" alt=""><span class="label">Pomme</span></div>
  <label class="search" title="Rechercher (Ctrl+F)"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.2 4.2-1.4 1.4-4.2-4.2A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg><input id="q" type="search" placeholder="Rechercher" autocomplete="off" spellcheck="false"></label>
  <nav id="nav">
    <div class="sec">Apple Music</div>
    <a data-view="home" title="Écouter maintenant"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span class="label">Écouter maintenant</span></a>
    <a data-view="browse" title="Parcourir"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg><span class="label">Parcourir</span></a>
    <a data-view="radio" title="Radio"><svg viewBox="0 0 24 24"><path d="M12 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM7.8 7.8l1.4 1.4a4 4 0 0 0 0 5.6l-1.4 1.4a6 6 0 0 1 0-8.4zm8.4 0a6 6 0 0 1 0 8.4l-1.4-1.4a4 4 0 0 0 0-5.6zM5 5l1.4 1.4a8 8 0 0 0 0 11.2L5 19A10 10 0 0 1 5 5zm14 0a10 10 0 0 1 0 14l-1.4-1.4a8 8 0 0 0 0-11.2z"/></svg><span class="label">Radio</span></a>
    <div class="sec">Bibliothèque</div>
    <a data-view="recent" title="Ajouts récents"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zm-1 4v6l5 3 1-1.6-4-2.4V7z"/></svg><span class="label">Ajouts récents</span></a>
    <a data-view="artists" title="Artistes"><svg viewBox="0 0 24 24"><path d="M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm0 10c4.4 0 8 2 8 4.5V20H4v-1.5C4 16 7.6 14 12 14z"/></svg><span class="label">Artistes</span></a>
    <a data-view="albums" title="Albums"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zm8 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 3a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg><span class="label">Albums</span></a>
    <a data-view="songs" title="Morceaux"><svg viewBox="0 0 24 24"><path d="M10 4h10v3h-8v10a3 3 0 1 1-2-2.8z"/></svg><span class="label">Morceaux</span></a>
    <div class="sec">Sur cet ordinateur</div>
    <a data-view="local-songs" title="Morceaux locaux"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H4zm-1 13h18v2H3z"/></svg><span class="label">Morceaux</span></a>
    <a data-view="local-albums" title="Albums locaux"><svg viewBox="0 0 24 24"><path d="M3 6h14v14H3zm16-2v14h2V4zm-4-2H5v2h10z"/></svg><span class="label">Albums</span></a>
    <a data-view="local-artists" title="Artistes locaux"><svg viewBox="0 0 24 24"><path d="M9 5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zm0 9c3.9 0 7 1.7 7 4v2H2v-2c0-2.3 3.1-4 7-4zm8-8a3 3 0 1 1 0 6"/></svg><span class="label">Artistes</span></a>
    <div class="sec needs-auth">Playlists</div>
    <div id="playlists" class="needs-auth"></div>
  </nav>
  <div class="side-foot">
    <button id="account" class="ghost" title="Compte Apple Music"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zm0 4a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0 8c-2.2 0-4 .9-5 2.2a7 7 0 0 0 10 0c-1-1.3-2.8-2.2-5-2.2z"/></svg><span class="label" id="account-label">Se connecter</span></button>
    <button id="settings-btn" class="ghost icon" title="Réglages"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zm8.6 2.3-1.7-.3a7 7 0 0 0-.7-1.7l1-1.4-1.6-1.6-1.4 1a7 7 0 0 0-1.7-.7l-.3-1.7h-2.4l-.3 1.7a7 7 0 0 0-1.7.7l-1.4-1-1.6 1.6 1 1.4a7 7 0 0 0-.7 1.7l-1.7.3v2.4l1.7.3c.2.6.4 1.2.7 1.7l-1 1.4 1.6 1.6 1.4-1c.5.3 1.1.5 1.7.7l.3 1.7h2.4l.3-1.7c.6-.2 1.2-.4 1.7-.7l1.4 1 1.6-1.6-1-1.4c.3-.5.5-1.1.7-1.7l1.7-.3z"/></svg></button>
  </div>
</aside>
<div id="scrim"></div>

<main id="main">
  <div id="topbar"><button id="menu-btn" class="ghost icon" title="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button><button id="back-btn" class="ghost icon" title="Retour"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7 1.4-1.4L10.8 12l5.6-5.6z"/></svg></button></div>
  <div id="view"></div>
</main>

<section id="panel" hidden>
  <div class="panel-head"><div class="tabs"><button data-panel="lyrics">Paroles</button><button data-panel="queue">À suivre</button></div><button class="ghost icon" id="panel-close" title="Fermer">✕</button></div>
  <div id="panel-body"></div>
</section>

<footer id="player">
  <div class="now">
    <button id="np-cover" title="Afficher les paroles en plein écran"><svg viewBox="0 0 24 24"><path d="M10 4h10v3h-8v10a3 3 0 1 1-2-2.8z"/></svg><img id="np-art" alt="" hidden></button>
    <div class="np-text"><div id="np-title">Pomme</div><div id="np-sub">Choisissez de la musique</div></div>
    <span id="np-badge" class="badge" hidden></span>
  </div>
  <div class="transport">
    <div class="buttons">
      <button id="shuffle" class="ghost icon small" title="Aléatoire"><svg viewBox="0 0 24 24"><path d="M17 4l4 4-4 4V9h-2.2l-6.6 9H4v-2h3.2l6.6-9H17V4zM4 7h4.2l2 2.7-1.2 1.7L7.2 9H4V7zm11.8 8H17v-3l4 4-4 4v-3h-2.2l-2-2.7 1.2-1.7 1.8 2.4z"/></svg></button>
      <button id="prev" class="ghost icon" title="Précédent"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button id="play" class="play" title="Lecture"><svg viewBox="0 0 24 24" class="play-ico"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="next" class="ghost icon" title="Suivant"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <button id="repeat" class="ghost icon small" title="Répéter"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg><i class="repeat-one" hidden>1</i></button>
    </div>
    <div class="seek"><span class="t-pos">0:00</span><div class="bar"><div class="bar-fill"></div></div><span class="t-dur">0:00</span></div>
  </div>
  <div class="extras">
    <button id="lyrics-btn" class="ghost icon small" title="Paroles"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 3V4zm3 4v2h10V8H7zm0 3v2h7v-2H7z"/></svg></button>
    <button id="queue-btn" class="ghost icon small" title="À suivre"><svg viewBox="0 0 24 24"><path d="M3 5h12v2H3zm0 4h12v2H3zm0 4h8v2H3zm14 0v-4h2v4h3v2h-3v4h-2v-4h-3v-2z"/></svg></button>
    <button id="out-btn" class="ghost icon small" title="Sortie audio (haut-parleurs, casque, Bluetooth)"><svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm6 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 2.2a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6z"/></svg></button>
    <button id="mini-btn" class="ghost icon small" title="Mini-lecteur"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zm2 2v10h14V7zm6 5h7v4h-7z"/></svg></button>
    <div class="vol"><svg viewBox="0 0 24 24" class="vol-ico"><path d="M4 9h4l5-4v14l-5-4H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg><input id="vol" type="range" min="0" max="1" step="0.01" title="Volume"></div>
  </div>
</footer>

<!-- lecture en plein écran avec paroles -->
<section id="np" hidden>
  <div class="np-bg"><img id="np-bg" alt=""></div>
  <button class="ghost icon np-close" id="np-close" title="Fermer (Échap)"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5 1.4 1.4L12 17.8l-6.4-6.4z"/></svg></button>
  <div class="np-left">
    <img id="np-big" alt="">
    <div class="np-meta"><div class="np-t" id="np-big-title"></div><div class="np-s" id="np-big-sub"></div></div>
    <div class="seek"><span class="t-pos">0:00</span><div class="bar"><div class="bar-fill"></div></div><span class="t-dur">0:00</span></div>
    <div class="buttons big">
      <button class="ghost icon" data-act="shuffle" title="Aléatoire"><svg viewBox="0 0 24 24"><path d="M17 4l4 4-4 4V9h-2.2l-6.6 9H4v-2h3.2l6.6-9H17V4zM4 7h4.2l2 2.7-1.2 1.7L7.2 9H4V7zm11.8 8H17v-3l4 4-4 4v-3h-2.2l-2-2.7 1.2-1.7 1.8 2.4z"/></svg></button>
      <button class="ghost icon" data-act="prev" title="Précédent"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="play" data-act="play" title="Lecture"><svg viewBox="0 0 24 24" class="play-ico"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ghost icon" data-act="next" title="Suivant"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <button class="ghost icon" data-act="repeat" title="Répéter"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
    </div>
  </div>
  <div class="np-right">
    <div class="tabs np-tabs"><button data-np="lyrics">Paroles</button><button data-np="queue">À suivre</button></div>
    <div class="np-lyrics" id="np-lyrics"></div>
    <div class="np-queue" id="np-queue" hidden></div>
  </div>
</section>

<!-- mini-lecteur -->
<section id="mini" hidden>
  <div class="np-bg"><img id="mini-bg" alt=""></div>
  <img id="mini-art" alt="">
  <div class="mini-meta"><div class="np-t" id="mini-title">Pomme</div><div class="np-s" id="mini-sub"></div></div>
  <div class="seek"><span class="t-pos">0:00</span><div class="bar"><div class="bar-fill"></div></div><span class="t-dur">0:00</span></div>
  <div class="buttons">
    <button class="ghost icon" data-act="prev" title="Précédent"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="play" data-act="play" title="Lecture"><svg viewBox="0 0 24 24" class="play-ico"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="ghost icon" data-act="next" title="Suivant"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  </div>
  <button class="ghost mini-exit" id="mini-exit" title="Agrandir">⤢ Agrandir</button>
</section>

<!-- connexion Apple (la page d'Apple s'affiche au centre, par-dessus) -->
<div id="auth" hidden><div class="auth-bar"><span>Connexion à Apple Music — passkey iPhone, Windows Hello ou mot de passe</span><button class="btn" id="auth-cancel">Annuler</button></div></div>

<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
