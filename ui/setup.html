<style>
:root { --text: #f3f5fb; --soft: #d0d6e6; --line: rgba(255,255,255,.14); --accent: #fa2d62; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14.5px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text); background: rgba(10, 11, 18, .66); display: flex; flex-direction: column; user-select: none; overflow: hidden; }
body.opaque { background: #0e0f18; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(60% 45% at 10% 0%, rgba(250,45,98,.28), transparent 70%), radial-gradient(60% 55% at 100% 100%, rgba(140,92,255,.26), transparent 70%); }
header { display: flex; align-items: center; gap: 14px; padding: 22px 26px 6px; }
header svg { width: 52px; height: 52px; }
h1 { margin: 0; font: 700 26px "Segoe UI Variable Display", "Segoe UI", sans-serif; }
.sub { color: var(--soft); font-size: 13px; }
main { flex: 1; overflow-y: auto; padding: 12px 26px; }
.box { padding: 14px 16px; border-radius: 16px; margin-bottom: 12px; background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035)); border: 1px solid var(--line); }
.box h2 { margin: 0 0 10px; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: #b9c1d6; }
.note { color: var(--soft); font-size: 13.5px; margin-top: 6px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
input[type=text] { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--text); font: inherit; outline: none; }
input[type=text]:focus { border-color: rgba(250,45,98,.7); }
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; margin-right: 18px; padding: 4px 0; }
.toggle i { width: 40px; height: 23px; border-radius: 12px; background: rgba(255,255,255,.2); position: relative; transition: background .15s; flex: none; }
.toggle i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle.on i { background: var(--accent); }
.toggle.on i::after { transform: translateX(17px); }
.chip { padding: 7px 13px; border-radius: 17px; border: 1px solid var(--line); background: rgba(255,255,255,.06); cursor: pointer; }
.chip.on { background: rgba(250,45,98,.25); border-color: rgba(250,45,98,.6); }
.choice { display: flex; gap: 14px; align-items: center; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.04); margin-bottom: 8px; cursor: pointer; }
.choice:hover { background: rgba(255,255,255,.08); }
.choice.on { background: rgba(250,45,98,.18); border-color: rgba(250,45,98,.55); }
.choice .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #cfd5e5; flex: none; position: relative; }
.choice.on .dot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: #fff; }
.choice b { display: block; font-size: 15.5px; }
.choice span { color: var(--soft); font-size: 13.5px; }
footer { display: flex; align-items: center; gap: 10px; padding: 14px 26px 20px; }
footer .grow { flex: 1; color: #b9c1d6; font-size: 12.5px; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; padding: 11px 22px; color: #fff; }
.primary { min-width: 170px; font-weight: 700; font-size: 15.5px; background: linear-gradient(135deg, #ff3b6e, #f0306a 45%, #9b5cff); box-shadow: 0 8px 26px rgba(250,45,98,.45), inset 0 1px 0 rgba(255,255,255,.35); }
.primary:hover { filter: brightness(1.12); }
.secondary { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28); font-weight: 600; }
.secondary:hover { background: rgba(255,255,255,.22); }
.small { padding: 8px 14px; border-radius: 10px; }
.center { text-align: center; padding: 40px 10px; }
.spinner { width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%; border: 3px solid rgba(255,255,255,.18); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ok { color: #4ce6a0; font-size: 21px; font-weight: 700; }
.err { color: #ff8080; font-size: 19px; font-weight: 700; }
.warn { color: #ffcc66; font-size: 13.5px; margin-top: 4px; }
[hidden] { display: none !important; }
</style>

emdevgit</b>: weitere Programme auf github.com/jeremdevgit.","Pomme riproduce la tua musica locale e, con un abbonamento, Apple Music. Pomme non è affiliato né approvato da Apple. Software libero (GPL-3.0) creato da <b>jeremdevgit</b>: gli altri suoi programmi sono su github.com/jeremdevgit.","O Pomme toca a sua música local e, com uma assinatura, o Apple Music. O Pomme não é afiliado nem endossado pela Apple. Software livre (GPL-3.0) criado por <b>jeremdevgit</b>: os outros programas estão em github.com/jeremdevgit.","Pomme 可播放你的本地音乐，订阅后还可播放 Apple Music。Pomme 与 Apple 无关联，也未获 Apple 认可。由 <b>jeremdevgit</b> 开发的自由软件（GPL-3.0），更多软件见 github.com/jeremdevgit。","Pomme はローカルの音楽と、サブスクリプションがあれば Apple Music を再生します。Pomme は Apple と提携しておらず、Apple の承認も受けていません。<b>jeremdevgit</b> によるフリーソフトウェア（GPL-3.0）。ほかのソフトは github.com/jeremdevgit にあります。"],"Version {v}":["Version {v}","Versión {v}","Version {v}","Versione {v}","Versão {v}","版本 {v}","バージョン {v}"],"Annuler":["Cancel","Cancelar","Abbrechen","Annulla","Cancelar","取消","キャンセル"],"Mettre à jour":["Update","Actualizar","Aktualisieren","Aggiorna","Atualizar","更新","更新"],"Installer":["Install","Instalar","Installieren","Installa","Instalar","安装","インストール"],"Gérer Pomme":["Manage Pomme","Gestionar Pomme","Pomme verwalten","Gestisci Pomme","Gerenciar o Pomme","管理 Pomme","Pomme の管理"],"Que voulez-vous faire ?":["What would you like to do?","¿Qué quieres hacer?","Was möchten Sie tun?","Cosa vuoi fare?","O que você quer fazer?","你想做什么？","何をしますか？"],"Réparer Pomme":["Repair Pomme","Reparar Pomme","Pomme reparieren","Ripara Pomme","Reparar o Pomme","修复 Pomme","Pomme を修復"],"Restaure les fichiers et les raccourcis. Votre bibliothèque et vos réglages sont gardés.":["Restores the files and shortcuts. Your library and settings are kept.","Restaura los archivos y los accesos directos. Se conservan tu biblioteca y tus ajustes.","Stellt die Dateien und Verknüpfungen wieder her. Mediathek und Einstellungen bleiben erhalten.","Ripristina i file e i collegamenti. La l ierung in Windows…","Registrazione in Windows…","Registrando no Windows…","正在向 Windows 注册…","Windows に登録しています…"],"Préférences…":["Preferences…","Preferencias…","Einstellungen…","Preferenze…","Preferências…","偏好设置…","設定…"],"Installation introuvable":["Installation not found","No se encuentra la instalación","Installation nicht gefunden","Installazione non trovata","Instalação não encontrada","找不到安装","インストールが見つかりません"],"Fermeture de Pomme…":["Closing Pomme…","Cerrando Pomme…","Pomme wird geschlossen…","Chiusura di Pomme…","Fechando o Pomme…","正在关闭 Pomme…","Pomme を終了しています…"],"Raccourcis et démarrage automatique…":["Shortcuts and automatic startup…","Accesos directos e inicio automático…","Verknüpfungen und Autostart…","Collegamenti e avvio automatico…","Atalhos e inicialização automática…","快捷方式和开机启动…","ショートカットと自動起動…"],"Suppression des fichiers…":["Deleting files…","Eliminando archivos…","Dateien werden gelöscht…","Eliminazione dei file…","Apagando arquivos…","正在删除文件…","ファイルを削除しています…"],"Retrait de l'inscription Windows…":["Removing the Windows registration…","Quitando el registro de Windows…","Windows-Registrierung wird entfernt…","Rimozione della registrazione in Windows…","Removendo o registro do Windows…","正在移除 Windows 注册…","Windows への登録を解除しています…"],"Indiquez un chemin complet, par exemple C:\\Users\\vous\\AppData\\Local\\Programs\\Pomme":["Enter a full path, for example C:\\Users\\you\\AppData\\Local\\Programs\\Pomme","Indica una ruta completa, por ejemplo C:\\Users\\tú\\AppData\\Local\\Programs\\Pomme","Geben Sie einen vollständigen Pfad an, zum Beispiel C:\\Users\\Sie\\AppData\\Local\\Programs\\Pomme","Indica un percorso completo, ad esempio C:\\Users\\tu\\AppData\\Local\\Programs\\Pomme","Informe um caminho completo, por exemplo C:\\Users\\você\\AppData\\Local\\Programs\\Pomme","请输入完整路径，例如 C:\\Users\\你\\AppData\\Local\\Programs\\Pomme","完全なパスを入力してください（例：C:\\Users\\あなた\\AppData\\Local\\Programs\\Pomme）"],"Le chemin contient des caractères interdits.":["The path contains characters that aren't allowed.","La ruta contiene caracteres no permitidos.","Der Pfad enthält unzulässige Zeichen.","Il percorso contiene caratteri non consentiti.","O caminho contém caracteres não permitidos.","路径包含不允许的字符。","パスに使用できない文字が含まれています。"],"Impossible d'installer dans le dossier de Windows.":["Can't install into the Windows folder.","No se puede instalar en la carpeta de Windows.","Installation im Windows-Ordner nicht möglich.","Impossibile installare nella cartella di Windows.","Não é possível instalar na pasta do Windows.","无法安装到 Windows 文件夹。","Windows フォルダーにはインストールできません。"]}/*FIN*/;
const T = (s, v) => String((TEXTES[s] || [])[LANGS.indexOf(LANG) - 1] || s).replace(/\{(\w+)\}/g, (m, k) => (v && k in v ? v[k] : m));
// message du programme (« Raccourci non créé : chemin ») : traduit, détail conservé
const TM = m => { m = String(m || ''); const i = m.indexOf(' : '); return i > 0 && T(m) === m ? T(m.slice(0, i)) + (LANG === 'fr' ? ' : ' : LANG === 'zh' || LANG === 'ja' ? '：' : ': ') + m.slice(i + 3) : T(m); };
document.documentElement.lang = LANG;

function toggle(key, label) { return `<span class="toggle${S.opts[key] ? ' on' : ''}" data-k="${key}"><i></i>${label}</span>`; }

function renderSetup() {
  $('#title').textContent = T(S.existing ? 'Mettre à jour Pomme' : 'Installer Pomme');
  $('#main').innerHTML = `
    <div class="box"><h2>${T("Dossier d'installation")}</h2>
      <div class="row"><input type="text" id="dir" value="${esc(S.opts.dir)}" spellcheck="false"><button class="secondary small" id="browse">${T('Parcourir…')}</button></div>
      <div class="note">${T("Pomme s'installe pour votre compte Windows : aucun droit administrateur n'est nécessaire.")}</div>
      <div class="warn" id="dir-err" hidden></div>
      ${S.existing ? `<div class="note">${S.existingVersion ? T('La version {v} déjà installée sera remplacée.', { v: esc(S.existingVersion) }) : T('La version déjà installée sera remplacée.')} ${T('Votre bibliothèque, vos réglages et votre connexion Apple Music sont conservés.')}</div>` : ''}</div>
    <div class="box"><h2>${T('Raccourcis')}</h2>
      <div class="row">${toggle('desktop', T('Bureau'))}${toggle('startMenu', T('Menu Démarrer'))}</div>
      <div class="note">${T("Barre des tâches : Windows réserve l'épinglage à l'utilisateur. Une fois installé, clic droit sur Pomme dans le menu Démarrer › Épingler à la barre des tâches.")}</div></div>
    <div class="box"><h2>${T('Démarrage et fermeture')}</h2>
      <div class="row">${toggle('autostart', T('Lancer Pomme au démarrage du PC'))}</div>
      <div class="row" style="margin-top:8px"><span>${T('Bouton fermer :')}</span><span class="chip${S.opts.closeToTray ? ' on' : ''}" data-tray="1">${T('Garder la musique dans la zone de notification')}</span><span class="chip${!S.opts.closeToTray ? ' on' : ''}" data-tray="0">${T('Quitter Pomme')}</span></div>
      <div class="note">${T('Modifiable à tout moment dans les Réglages de Pomme.')}</div></div>
    <div class="box"><h2>${T('À savoir')}</h2>
      <div class="note" style="margin:0">${T("Pomme lit votre musique locale et, avec un abonnement, Apple Music. Pomme n'est ni affilié ni approuvé par Apple. Logiciel libre (GPL-3.0) créé par <b>jeremdevgit</b> : ses autres logiciels sont sur github.com/jeremdevgit.")}</div></div>`;
  $('#foot').innerHTML = `<span class="grow">${T('Version {v}', { v: esc(S.version) })}</span><button class="secondary" id="cancel">${T('Annuler')}</button><button class="primary" id="go">${T(S.existing ? 'Mettre à jour' : 'Installer')}</button>`;
  document.querySelectorAll('.toggle').forEach(t => t.onclick = () => { S.opts[t.dataset.k] = !S.opts[t.dataset.k]; S.opts.dir = $('#dir').value; renderSetup(); });
  document.querySelectorAll('[data-tray]').forEach(c => c.onclick = () => { S.opts.closeToTray = c.dataset.tray === '1'; S.opts.dir = $('#dir').value; renderSetup(); });
  $('#browse').onclick = () => send('browse');
  $('#cancel').onclick = () => send('close');
  $('#go').onclick = () => { S.opts.dir = $('#dir').value; run('install'); };
}

function renderMaintenance() {
  $('#title').textContent = T('Gérer Pomme');
  const c = (t, title, sub) => `<div class="choice${S.task === t ? ' on' : ''}" data-t="${t}"><div class="dot"></div><div><b>${T(title)}</b><span>${T(sub)}</span></div></div>`;
  $('#main').innerHTML = `<div class="box"><h2>${T('Que voulez-vous faire ?')}</h2>
    ${c('repair', 'Réparer Pomme', 'Restaure les fichiers et les raccourcis. Votre bibliothèque et vos réglages sont gardés.')}
    ${c('uninstall', 'Désinstaller l\'application', 'Supprime Pomme mais garde votre bibliothèque, vos réglages et votre connexion Apple Music.')}
    ${c('uninstall-all', 'Tout désinstaller', 'Supprime Pomme et tout ce qu\'il a créé : bibliothèque, réglages, connexion Apple Music, cache.')}
    </div><div class="note">${T('Vos fichiers de musique ne sont jamais supprimés : Pomme ne fait que les lire.')}</div>`;
  $('#foot').innerHTML = `<span class="grow">${T('Version {v}', { v: esc(S.version) })}</span><button class="secondary" id="cancel">${T('Annuler')}</button><button class="primary" id="go">${T(S.task === 'repair' ? 'Réparer' : 'Désinstaller')}</button>`;
  document.querySelectorAll('.choice').forEach(x => x.onclick = () => { S.task = x.dataset.t; renderMaintenance(); });
  $('#cancel').onclick = () => send('close');
  $('#go').onclick = () => run(S.task);
}

function run(task) {
  S.task = task;
  $('#main').innerHTML = `<div class="center"><div class="spinner"></div><div id="step" style="font-size:15.5px">${T('Préparation…')}</div></div>`;
  $('#foot').innerHTML = '';
  send('run', { task, opts: S.opts, lang: LANG });
}

function done(m) {
  const uninstall = S.task.startsWith('uninstall');
  if (!m.ok) {
    $('#main').innerHTML = `<div class="box"><div class="err">${T("L'opération n'a pas abouti")}</div><div class="note">${esc(TM(m.error))}</div></div>`;
    $('#foot').innerHTML = `<span class="grow"></span><button class="secondary" id="cancel">${T('Fermer')}</button><button class="primary" id="retry">${T('Réessayer')}</button>`;
    $('#cancel').onclick = () => send('close');
    $('#retry').onclick = () => (S.mode === 'setup' ? renderSetup() : renderMaintenance());
    return;
  }
  const title = { install: 'Pomme est installé ✔', repair: 'Pomme est réparé ✔', uninstall: 'Pomme est désinstallé ✔', 'uninstall-all': 'Pomme et ses données sont supprimés ✔' }[S.task];
  let html = `<div class="box"><div class="ok">${T(title)}</div>`;
  if (S.task === 'uninstall') html += `<div class="note">${T('Votre bibliothèque, vos réglages et votre connexion sont conservés pour une prochaine installation.')}</div>`;
  if (!uninstall) html += `<div class="note">${T("Pour l'épingler : clic droit sur Pomme dans le menu Démarrer › Épingler à la barre des tâches.")}</div>`;
  for (const n of m.notes || []) html += `<div class="warn">⚠ ${esc(TM(n))}</div>`;
  if (!uninstall) html += `<div class="row" style="margin-top:12px"><span class="toggle on" id="launch"><i></i>${T('Lancer Pomme maintenant')}</span></div>`;
  $('#main').innerHTML = html + '</div>';
  $('#foot').innerHTML = `<span class="grow"></span><button class="primary" id="finish">${T('Terminer')}</button>`;
  $('#launch')?.addEventListener('click', e => e.currentTarget.classList.toggle('on'));
  $('#finish').onclick = () => { if (!uninstall && $('#launch')?.classList.contains('on')) send('launch'); send('close'); };
}

window.setup = {
  recv(m) {
    if (m.type === 'init') {
      Object.assign(S, m);
      if (!m.glass) document.body.classList.add('opaque');
      $('#version').textContent = T('Lecteur Apple Music et musique locale · version {v}', { v: m.version });
      S.mode === 'setup' ? renderSetup() : renderMaintenance();
    } else if (m.type === 'dir') { S.opts.dir = m.dir; $('#dir').value = m.dir; }
    else if (m.type === 'step') { const s = $('#step'); if (s) s.textContent = TM(m.text); }
    else if (m.type === 'done') done(m);
  },
};
$('#title').textContent = T('Installer Pomme');
send('init', { lang: LANG });
</script>
</body>
</html>
