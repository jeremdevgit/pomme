[package]
name = "pomme"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Pomme : lecteur Apple Music et fichiers locaux, léger et fluide"

[[bin]]
name = "Pomme"
path = "src/main.rs"

[dependencies]
wry = "0.57"
tao = "0.37"
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
] }
symphonia = { version = "0.5", default-features = false, features = ["flac", "alac", "mp1", "mp2", "mp3", "aac", "adpcm", "isomp4", "mkv", "caf", "wav", "pcm", "ogg", "vorbis", "aiff"] }
cpal = "0.15"
rubato = "5.0"
lofty = "0.22"
souvlaki = "0.7"
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.20"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_Security"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

[target.'cfg(windows)'.dependencies]
mdns-sd = "0.17"
cidermill-airplay = "=0.1.5"
wasapi = "0.27"
native-tls = "0.2"
getrandom = "0.4"
